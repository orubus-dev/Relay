name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GENJUTSU_URL: ${{ secrets.VITE_GENJUTSU_URL }}
          VITE_GENJUTSU_PUBLISHABLE_KEY: ${{ secrets.VITE_GENJUTSU_PUBLISHABLE_KEY }}
        run: npm run build:web

      # NOTE: no dist/_redirects SPA rule — _redirects is evaluated BEFORE
      # Pages Functions and would shadow the same-origin auth proxy in
      # functions/. Pages' built-in SPA fallback (index.html, no 404.html)
      # already serves unknown routes.

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=relayid --branch=main --commit-dirty=true
